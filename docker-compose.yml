services:
  redis:
    image: redis:8.6.3
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: elasticsearch:8.19.15
    restart: unless-stopped
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE:-4G} -Xmx${ELASTIC_MEMORY_SIZE:-4G}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    volumes:
      - s3data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opencti}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:4.3.0-management
    restart: unless-stopped
    volumes:
      - amqpdata:/var/lib/rabbitmq
      - ./opencti-platform/opencti-dev/rabbitmq.config:/etc/rabbitmq/conf.d/90-userdefined.conf
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-opencti}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-changeme-rabbitmq}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3

  opencti:
    build:
      context: ./opencti-platform
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max_old_space_size=8096
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_BASE_URL:-http://localhost:8080}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL:-admin@opencti.io}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:-ChangeMePlease}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:-b1976749-8a53-4c49-a8c2-47d7d52e3f9a}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY:-dGhpcklzQVRlc3RLZXlGb3JEZXZPbmx5MTIzNDU2Nzg=}
      - APP__APP_LOGS__LOGS_LEVEL=info
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY:-healthcheck-key}
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER:-opencti}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme-minio}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER:-opencti}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS:-changeme-rabbitmq}
      - SMTP__HOSTNAME=${SMTP_HOSTNAME:-localhost}
      - SMTP__PORT=25
      - AI__ENABLED=${AI_ENABLED:-false}
      - AI__TYPE=${AI_TYPE:-anthropic}
      - AI__TOKEN=${AI_TOKEN:-}
      - AI__MODEL=${AI_MODEL:-claude-sonnet-4-6-20250514}
      - AI__MAX_TOKENS=${AI_MAX_TOKENS:-4096}
    ports:
      - "${OPENCTI_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./opencti-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:-b1976749-8a53-4c49-a8c2-47d7d52e3f9a}
      - WORKER_LOG_LEVEL=info
    depends_on:
      - opencti

volumes:
  redisdata:
  esdata:
  s3data:
  amqpdata:
