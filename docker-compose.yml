services:
  redis:
    image: redis:8.6.3
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: elasticsearch:8.19.15
    restart: unless-stopped
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE:-4G} -Xmx${ELASTIC_MEMORY_SIZE:-4G}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    volumes:
      - s3data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opencti}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:4.3.0-management
    restart: unless-stopped
    volumes:
      - amqpdata:/var/lib/rabbitmq
      - ./opencti-platform/opencti-dev/rabbitmq.config:/etc/rabbitmq/conf.d/90-userdefined.conf
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-opencti}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-changeme-rabbitmq}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3

  opencti:
    build:
      context: ./opencti-platform
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max_old_space_size=8096
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_BASE_URL:-http://localhost:8080}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL:-admin@opencti.io}
      # Sensitive secrets MUST be provided via .env (no insecure fallback).
      # The platform refuses to start if these are missing or set to the example values.
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:?Set OPENCTI_ADMIN_PASSWORD in .env}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env (uuidgen)}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY:?Set OPENCTI_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      - APP__APP_LOGS__LOGS_LEVEL=info
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY:?Set OPENCTI_HEALTHCHECK_ACCESS_KEY in .env}
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER:-opencti}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD:-changeme-minio}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER:-opencti}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS:-changeme-rabbitmq}
      - SMTP__HOSTNAME=${SMTP_HOSTNAME:-localhost}
      - SMTP__PORT=25
      - AI__ENABLED=${AI_ENABLED:-false}
      - AI__TYPE=${AI_TYPE:-anthropic}
      - AI__TOKEN=${AI_TOKEN:-}
      - AI__MODEL=${AI_MODEL:-claude-3-5-sonnet-20241022}
      - AI__MAX_TOKENS=${AI_MAX_TOKENS:-4096}
    ports:
      - "${OPENCTI_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./opencti-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - WORKER_LOG_LEVEL=info
    depends_on:
      - opencti

  # ── Connectors ─────────────────────────────────────────────────────────

  # MITRE ATT&CK - Attack patterns, techniques, tactics, threat actors, malware
  connector-mitre:
    image: opencti/connector-mitre:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=5a6b4c3d-mitre-att-ck
      - CONNECTOR_NAME=MITRE ATT&CK
      - CONNECTOR_SCOPE=marking-definition,identity,attack-pattern,course-of-action,intrusion-set,campaign,malware,tool,report,vulnerability,external-reference-as-report
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_DURATION_PERIOD=P7D
      - MITRE_ENTERPRISE_FILE_URL=https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
      - MITRE_PRE_ATTACK_FILE_URL=https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/pre-attack/pre-attack.json
      - MITRE_MOBILE_ATTACK_FILE_URL=https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/mobile-attack/mobile-attack.json
      - MITRE_ICS_ATTACK_FILE_URL=https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/ics-attack/ics-attack.json
      - MITRE_INTERVAL=7
    depends_on:
      - opencti

  # CVE / NVD - Common Vulnerabilities and Exposures
  connector-cve:
    image: opencti/connector-cve:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=6b7c8d9e-cve-nvd
      - CONNECTOR_NAME=Common Vulnerabilities and Exposures
      - CONNECTOR_SCOPE=identity,vulnerability
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_DURATION_PERIOD=P1D
      - CVE_NVD_DATA_FEED=https://nvd.nist.gov/feeds/json/cve/1.1/nvdcve-1.1-recent.json.gz
      - CVE_NVD_API_KEY=${NVD_API_KEY:-}
      - CVE_INTERVAL=24
      - CVE_MAX_DATE_RANGE=120
    depends_on:
      - opencti

  # AlienVault OTX - Threat intelligence pulses (IOCs, threat actors, malware)
  connector-alienvault:
    image: opencti/connector-alienvault:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=7c8d9e0f-alienvault-otx
      - CONNECTOR_NAME=AlienVault OTX
      - CONNECTOR_SCOPE=alienvault
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT6H
      - ALIENVAULT_BASE_URL=https://otx.alienvault.com
      - ALIENVAULT_API_KEY=${ALIENVAULT_API_KEY:-}
      - ALIENVAULT_TLP=White
      - ALIENVAULT_CREATE_OBSERVABLES=true
      - ALIENVAULT_CREATE_INDICATORS=true
      - ALIENVAULT_PULSE_START_TIMESTAMP=2024-01-01T00:00:00
      - ALIENVAULT_REPORT_TYPE=threat-report
      - ALIENVAULT_REPORT_STATUS=New
      - ALIENVAULT_GUESS_MALWARE=false
      - ALIENVAULT_GUESS_CVE=false
      - ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES=FileHash-PEHASH,FileHash-IMPHASH
      - ALIENVAULT_INTERVAL=6
    depends_on:
      - opencti

  # Abuse.ch URLhaus - Malicious URLs used for malware distribution
  connector-urlhaus:
    image: opencti/connector-urlhaus:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=8d9e0f1a-urlhaus
      - CONNECTOR_NAME=Abuse.ch URLhaus
      - CONNECTOR_SCOPE=urlhaus
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT2H
      - URLHAUS_CSV_URL=https://urlhaus.abuse.ch/downloads/csv_recent/
      - URLHAUS_IMPORT_OFFLINE=true
      - URLHAUS_CREATE_INDICATORS=true
      - URLHAUS_INTERVAL=2
    depends_on:
      - opencti

  # CISA Known Exploited Vulnerabilities
  connector-cisa-known-exploited:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=9e0f1a2b-cisa-kev
      - CONNECTOR_NAME=CISA Known Exploited Vulnerabilities
      - CONNECTOR_SCOPE=cisa
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_DURATION_PERIOD=P1D
      - CISA_CATALOG_URL=https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      - CISA_CREATE_INFRASTRUCTURES=false
      - CISA_TLP=TLP:CLEAR
      - CISA_INTERVAL=24
    depends_on:
      - opencti

  # OpenCTI Datasets - Default threat actor, country, sector data
  connector-opencti:
    image: opencti/connector-opencti:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=0f1a2b3c-opencti-datasets
      - CONNECTOR_NAME=OpenCTI Datasets
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=P7D
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONFIG_SECTORS_FILE_URL=https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/sectors.json
      - CONFIG_GEOGRAPHY_FILE_URL=https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/geography.json
      - CONFIG_COMPANIES_FILE_URL=https://raw.githubusercontent.com/OpenCTI-Platform/datasets/master/data/companies.json
      - CONFIG_REMOVE_CREATOR=false
      - CONFIG_INTERVAL=7
    depends_on:
      - opencti

  # Import File STIX - Enables STIX bundle file import via the UI
  connector-import-file-stix:
    image: opencti/connector-import-file-stix:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=1a2b3c4d-import-file-stix
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true
    depends_on:
      - opencti

  # Export File STIX - Enables STIX bundle export from the UI
  connector-export-file-stix:
    image: opencti/connector-export-file-stix:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=2b3c4d5e-export-file-stix
      - CONNECTOR_NAME=ExportFileStix
      - CONNECTOR_SCOPE=application/json
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

  # Export File CSV - Enables CSV export from the UI
  connector-export-file-csv:
    image: opencti/connector-export-file-csv:7.260522.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in .env}
      - CONNECTOR_ID=3c4d5e6f-export-file-csv
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_LOG_LEVEL=info
    depends_on:
      - opencti

volumes:
  redisdata:
  esdata:
  s3data:
  amqpdata:
